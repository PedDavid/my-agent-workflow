# Standalone workspace for drove front-ends. Independent of the root `drove`
# crate: UIs talk to the daemon only through the socket protocol
# (docs/protocol.md), via the shared `drove-client` crate.
[workspace]
resolver = "2"
members = ["client", "tui", "web", "notify"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
drove-client = { path = "client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
