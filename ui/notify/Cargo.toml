[package]
name = "drove-notify"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Desktop notifications for drove agents (freedesktop, D-Bus)"

[dependencies]
drove-client.workspace = true
serde.workspace = true
serde_json.workspace = true
